name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (build + headless test + examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev \
            libegl1-mesa-dev libgles2-mesa-dev libx11-dev

      - name: Build demo (fxtk_sim)
        run: make -C demo-main fxtk_sim

      - name: Run headless unit tests
        run: make -C demo-main test

      - name: Build Lua runner (C core + embedded Lua 5.4; scripts load at runtime)
        run: |
          make -C demo-main lua
          test -x demo-main/fxtk_lua_runner
          test -e demo-main/fxtk_lua          # 兼容名

      - name: Run Lua binding self-test (headless)
        run: make -C demo-main lua-test

      - name: Build a representative set of examples
        run: make -C demo-main ex01_hello ex02_widgets ex03_anim ex07_snake ex14_resize

      - name: Build canvas tutorial examples (examples/canvas)
        run: make -C demo-main canvas_01_primitives canvas_03_offscreen canvas_06_interact

      - name: Headless-render canvas examples (catches resize crashes)
        run: |
          cd demo-main
          for e in canvas_01_primitives canvas_02_immediate canvas_03_offscreen canvas_04_custom_widget canvas_05_image canvas_06_interact canvas_07_aa; do
            # v2.5: 核心源清单补齐 —— 之前漏了 gesture/par/flex/svg/wm，
            # 导致 fx_gesture_feed 等符号未定义，这一步长期是红的。
            gcc -O2 -I. -I../components/fxtk test/render_canvas.c ../examples/canvas/$e.c \
              ../components/fxtk/fxtk.c ../components/fxtk/fxtk_draw.c \
              ../components/fxtk/fxtk_widgets.c ../components/fxtk/fxtk_extra.c \
              ../components/fxtk/fxtk_effects.c ../components/fxtk/fxtk_backends.c \
              ../components/fxtk/fxtk_gesture.c ../components/fxtk/fxtk_par.c \
              ../components/fxtk/fxtk_flex.c ../components/fxtk/fxtk_svg.c \
              ../components/fxtk/fxtk_wm.c \
              -o /tmp/rc_$e -lm
            /tmp/rc_$e 480 272 /tmp/$e.ppm || { echo "render crash at 480: $e"; exit 1; }
            /tmp/rc_$e 200 112 /tmp/${e}_small.ppm || { echo "render crash at 200: $e"; exit 1; }
          done
          echo "headless canvas render OK"

      - name: Warnings report (non-blocking)
        working-directory: demo-main
        run: |
          set +e
          # v2.4.5: 驱动已移到 drivers/ (v2.4.0 的独立化), 但这里的路径没跟着改 ——
          # 于是长期停在 "cc1: fatal error: fxtk_sdl_driver.c: No such file or directory",
          # 报告本身失去意义(它自己会 echo "report would be meaningless" 然后 exit 1)。
          gcc -O2 -Wall -Wextra -o /dev/null -I. -I../components/fxtk \
            ../components/fxtk/fxtk.c ../components/fxtk/fxtk_draw.c \
            ../components/fxtk/fxtk_widgets.c ../components/fxtk/fxtk_font.c \
            ../components/fxtk/fxtk_effects.c ../components/fxtk/fxtk_extra.c \
            ../components/fxtk/fxtk_backends.c \
            ../components/fxtk/fxtk_gesture.c ../components/fxtk/fxtk_par.c \
            ../components/fxtk/fxtk_flex.c ../components/fxtk/fxtk_svg.c \
            ../drivers/fxtk_sdl_driver.c raymarch.c gpu_raymarch.c \
            ../drivers/main_linux.c app.c app_desktop.c \
            -lSDL2 -lSDL2_ttf -lSDL2_image -lm -pthread -lEGL -lGLESv2 -lX11 2> /tmp/fxtk_warnings.txt
          if [ $? -ne 0 ]; then
            echo "❌ Warnings step: compile failed, report would be meaningless:"
            tail -30 /tmp/fxtk_warnings.txt
            exit 1
          fi
          n=$(grep -c 'warning:' /tmp/fxtk_warnings.txt)
          echo "Total -Wall -Wextra warnings: $n (v2.3.1 baseline: 69, advisory only)"


      - name: API 文档覆盖检查（头文件 → docs/api.md）
        run: python3 tools/check_api_docs.py

      - name: Golden image regression (画布金图, 逐像素)
        # 只跑画布示例金图: 它们走【纯软件假驱动】, 不依赖 GPU/SDL/字体文件, 因此在 CI runner 上可复现。
        # 演示页金图依赖 SDL/SDL_ttf 版本(不同 runner 渲染可能不逐位一致), 只在本地/参考环境跑, 见 tools/golden.sh。
        # 容差 1 用于吸收不同 gcc 版本下浮点抗锯齿的最后一位差异。
        run: GOLDEN_SKIP_DEMO=1 GOLDEN_TOL=1 ./tools/golden.sh

  windows-cross:
    name: Windows cross-build (mingw)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Vendor SDL2 Windows dev packages (setup_win_cross.sh)
        working-directory: demo-main
        run: bash ./setup_win_cross.sh

      - name: Cross-build demo, English demo (uses vendored third_party/SDL2-win)
        run: |
          cd demo-main
          bash ./build_win_sokol.sh
          bash ./build_win_sokol.sh app_en
          bash ./build_win_sokol.sh lua

      # v2.4.5: 这一步的名字原先叫 "Cross-build an example", 但它其实编的还是 demo,
      # 一个 example 都没编 —— 名字与行为不符, 属于"看着验了其实没验"。
      # 现在如实命名, 并真正把 autotrim 走到编译 (此前 --autotrim 被当成目标名,
      # 静默编出英文版, 开关一次都没生效; 而 tools/autotrim.sh 又缺 +x, 直接 exit 126)。
      - name: Cross-build demo with widget trimming (--autotrim)
        run: cd demo-main && bash ./build_win_sokol.sh --autotrim

  # v2.5.3: esp32-smoke job 已移除 —— fxtk 不再维护 ESP32 路径 (仅 PC: Linux/Windows + sokol)。
